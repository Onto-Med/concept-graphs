language_name: English
schema_instruction: |
  Return valid JSON only.
  The JSON field names MUST remain exactly:
  "candidates", "term", "category", "rationale", "concepts", "relations".
  Do not translate or rename JSON field names.
  Schema:
  {"candidates": [{"term": "...", "category": "...", "rationale": "..."}], "concepts": [{"id": "...", "label": "...", "category": "...", "terms": ["..."]}], "relations": [{"source_concept_id": "...", "relation": "...", "target_concept_id": "...", "confidence": 0.0}]}
  The output is validated as an ExpansionGeneration Pydantic model.
default_categories:
  - synonym
  - medication
  - diagnosis
  - symptom
  - procedure
default_relations:
  - may_indicate
  - treated_by
  - investigated_by
  - confirmed_by
relation_definitions:
  - id: equivalent_to
    source_categories: [synonym, abbreviation]
    target_categories: [synonym, abbreviation]
    description: Concepts or terms are equivalent labels, variants, or abbreviations.
  - id: related_to
    source_categories: [related_term]
    target_categories: [related_term]
    description: Concepts are clinically or semantically associated without a more specific relation.
  - id: may_indicate
    source_categories: [symptom]
    target_categories: [diagnosis]
    description: A symptom, sign, or finding may indicate a diagnosis.
  - id: treated_by
    source_categories: [diagnosis]
    target_categories: [medication, procedure]
    description: A diagnosis or condition may be treated by a medication or procedure.
  - id: investigated_by
    source_categories: [symptom]
    target_categories: [procedure]
    description: A symptom, sign, or finding may be investigated by a procedure or test.
  - id: confirmed_by
    source_categories: [diagnosis]
    target_categories: [procedure]
    description: A diagnosis or condition may be confirmed by a procedure or test.
  - id: broader_than
    source_categories: [broader_term]
    target_categories: [narrower_term]
    description: The source concept is broader than the target concept.
  - id: narrower_than
    source_categories: [narrower_term]
    target_categories: [broader_term]
    description: The source concept is narrower than the target concept.
prompt_template: |
  Generate medical query-expansion candidates for the provided term.

  Term: {term}
  Candidate language: {language_name} ({language})
  Limit per category: {limit_per_category}
  Allowed category IDs: {categories_json}
  Allowed relations and category connections: {relations_json}

  Important instructions:
  - Use exactly one of the allowed category IDs for each candidate and concept.
  - Use only listed relation IDs, and only between concepts with allowed source and target categories.
  - Concept terms must be the original term or generated candidate terms.
  - Prefer candidates in the requested language.
  - Standard abbreviations, drug names, and international medical terms may remain unchanged.
  - The optional rationale field is a short LLM explanation, not source evidence.
  - Return only structured output matching the ExpansionGeneration schema.

  {schema_instruction}
category_descriptions:
  synonym: Synonyms, near-synonyms, spelling variants, or lay terms.
  medication: Medications or drug classes associated with the input term.
  diagnosis: Diagnoses or diagnostic entities associated with the input term.
  symptom: Symptoms, signs, or clinical findings associated with the input term.
  procedure: Procedures, interventions, diagnostics, or treatments associated with the input term.
  abbreviation: Common abbreviations or expanded forms.
  broader_term: Broader parent concepts.
  narrower_term: Narrower child concepts.
  related_term: Other clinically or semantically related terms.
